<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lei Lucas - Primeiros Socorros AR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin:0; overflow:hidden; font-family:Arial;">
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights: true"
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity light="type: ambient; intensity: 1.8"></a-entity>
        <a-entity light="type: directional; intensity: 1.2" position="1 2 2"></a-entity>

        <!-- CENÁRIO: Boneco de Primeiros Socorros -->
        <a-entity id="kit-cena" position="0 -0.3 0.2" scale="0.8 0.8 0.8">
          
          <!-- Base (chão) -->
          <a-circle position="0 -0.5 0" rotation="-90 0 0" radius="0.8" color="#22c55e" opacity="0.3"></a-circle>

          <!-- Boneco deitado (tronco) -->
          <a-box position="0 -0.2 0" width="0.6" height="0.2" depth="1" color="#ffdbac" rounded></a-box>
          <!-- Cabeça -->
          <a-sphere position="0 -0.15 0.7" radius="0.25" color="#ffdbac"></a-sphere>
          
          <!-- Mãos fazendo compressão (animadas) -->
          <a-entity id="maos" position="0 0.3 0" animation="property: position; from: 0 0.3 0; to: 0 0.05 0; dur: 500; dir: alternate; loop: true; easing: easeInOutQuad">
            <a-box position="0 0 0" width="0.25" height="0.08" depth="0.25" color="#ff8a65"></a-box>
            <a-box position="0 0.08 0" width="0.25" height="0.08" depth="0.25" color="#ff8a65"></a-box>
          </a-entity>

          <!-- Coração pulsando no peito -->
          <a-sphere position="0 0.1 0.1" radius="0.12" color="#ef4444" 
                    animation="property: scale; from: 1 1 1; to: 1.3 1.3 1.3; dur: 400; dir: alternate; loop: true"></a-sphere>

          <!-- Texto 3D com instruções -->
          <a-text value="1. CHAME SAMU 192" position="0 0.8 0.1" align="center" color="#dc2626" width="2" font="exo2bold"></a-text>
          <a-text value="2. 30 COMPRESSOES" position="0 0.65 0.1" align="center" color="black" width="1.8"></a-text>
        </a-entity>
      </a-entity>
    </a-scene>

    <!-- PAINEL DE INSTRUÇÕES NA TELA -->
    <div id="painel" style="position:fixed; bottom:0; left:0; width:100%; background:white; border-radius:20px 20px 0 0; padding:15px; box-shadow:0 -5px 20px rgba(0,0,0,0.2); display:none;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
        <div style="background:#dc2626; color:white; border-radius:50%; width:35px; height:35px; display:flex; align-items:center; justify-content:center; font-weight:bold;">!</div>
        <b style="color:#dc2626;">LEI LUCAS 13.722/18 - PASSO A PASSO</b>
      </div>
      <div id="passo" style="font-size:15px; line-height:1.4;">
        <b>1.</b> Verifique se a criança responde<br>
        <b>2.</b> Ligue <b style="color:red;">SAMU 192</b><br>
        <b>3.</b> Inicie 30 compressões no centro do peito<br>
        <b>4.</b> Se engasgada: 5 tapas nas costas + 5 compressões abdominais
      </div>
      <button onclick="document.getElementById('painel').style.display='none'" style="margin-top:12px; width:100%; background:#22c55e; color:white; border:none; padding:10px; border-radius:10px; font-weight:bold;">ENTENDI</button>
    </div>

    <div id="scan" style="position:fixed; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.6); color:white; text-align:center; padding:20px;">
      <div>
        <div style="font-size:50px;">📦➡️❤️</div>
        <p style="font-weight:bold;">Aponte a câmera para o banner<br>do Kit de Primeiros Socorros</p>
      </div>
    </div>

    <script>
      const scene = document.querySelector('a-scene');
      scene.addEventListener('targetFound', () => {
        document.getElementById('scan').style.display = 'none';
        document.getElementById('painel').style.display = 'block';
      });
      scene.addEventListener('targetLost', () => {
        document.getElementById('scan').style.display = 'flex';
      });
    </script>
  </body>
</html>
