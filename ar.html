<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IFPA - Primeiros Socorros com AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin:0; overflow:hidden; }
    #loading { position:fixed; width:100%; height:100%; background:#111; color:white; display:flex; align-items:center; justify-content:center; z-index:999; flex-direction:column; font-family:sans-serif; text-align:center; }
    #info { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:white; padding:12px 20px; border-radius:30px; font-family:sans-serif; font-weight:bold; z-index:10; box-shadow:0 4px 10px rgba(0,0,0,0.3); }
  </style>
</head>
<body>
  <div id="loading">Carregando AR...<br><small>Permita o uso da câmera</small></div>
  <div id="info">📱 Aponte para o marcador PRIMEIROS SOCORROS</div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" 
           color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="kitImg" src="./kit.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane src="#kitImg" position="0 0.3 0" height="1.1" width="1.1" transparent="true" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000"></a-plane>
      <a-plane color="#d00000" position="0 -0.6 0" height="0.25" width="1.3" rounded="0.05"></a-plane>
      <a-text value="KIT DE PRIMEIROS SOCORROS - SAMU 192" align="center" position="0 -0.6 0.01" color="white" width="2.5" font="https://cdn.aframe.io/fonts/Roboto-msdf.json"></a-text>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    sceneEl.addEventListener("renderstart", () => {
      document.getElementById('loading').style.display = 'none';
    });
    sceneEl.addEventListener("targetFound", () => {
      document.getElementById('info').innerHTML = "✅ Kit Encontrado! | Lei Lucas 13.722/2018";
      document.getElementById('info').style.background = "#90EE90";
    });
    sceneEl.addEventListener("targetLost", () => {
      document.getElementById('info').innerHTML = "📱 Aponte para o marcador PRIMEIROS SOCORROS";
      document.getElementById('info').style.background = "white";
    });
  </script>
</body>
</html>
