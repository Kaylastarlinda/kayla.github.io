<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#102f2b">
<title>Laboratório Interativo | IFPA</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
:root{--bg:#102f2b;--teal:#176B5B;--mint:#e8f0ee;--ink:#0f3b34}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#top{position:fixed;left:0;right:0;top:0;z-index:6;display:flex;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}
.pill{background:rgba(16,47,43,.88);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;padding:9px 13px;border-radius:99px}
#st.ok{background:#176B5B}
#hud{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 56px);z-index:6;background:rgba(214,69,69,.92);color:#fff;font-weight:800;padding:8px 16px;border-radius:99px;font-size:14px;display:none}
#stage{position:fixed;inset:0;z-index:1;touch-action:none}
#hint{position:fixed;left:0;right:0;top:34%;z-index:2;text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 6px #000;pointer-events:none;padding:0 30px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#f6f9f8;border-radius:22px 22px 0 0;padding:6px 14px calc(env(safe-area-inset-bottom) + 12px);box-shadow:0 -6px 24px rgba(0,0,0,.35);max-height:46vh;display:flex;flex-direction:column}
#grab{align-self:center;border:0;background:#c9d6d3;width:46px;height:6px;border-radius:9px;margin:4px 0 8px;padding:0}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row button{flex:1 0 auto;border:0;border-radius:14px;background:#e1ebe8;color:var(--ink);font-weight:800;font-size:13px;padding:11px 14px;white-space:nowrap}
.row button.on{background:var(--teal);color:#fff}
.chips button{border-radius:99px;padding:8px 14px;font-size:12.5px}
.chips button.on{background:var(--bg)}
#body{overflow-y:auto;min-height:0}
#sheet.min #body{display:none}
h2{margin:2px 0 4px;font-size:19px;color:var(--ink)}
#intro{margin:0 0 8px;font-size:13.5px;color:#3d5a54;line-height:1.35}
#bar{display:flex;gap:5px;margin-bottom:8px}
#bar i{flex:1;height:5px;border-radius:9px;background:#cbd8d5}
#bar i.on{background:var(--teal)}
#txt{background:var(--mint);border-left:4px solid var(--teal);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:15px;line-height:1.4;color:#15342f}
.nav{display:flex;gap:8px}
.nav button{flex:1;border:0;border-radius:13px;padding:12px 6px;font-weight:800;font-size:14px;background:#dfe9e6;color:var(--ink)}
.nav #next{flex:2;background:var(--teal);color:#fff}
.nav button:disabled{opacity:.4}
.nav button.on{background:var(--bg);color:#fff}
small{display:block;margin-top:8px;color:#5d756f;font-size:11px;line-height:1.3}
</style>
</head>
<body>
<div id="top"><span class="pill">IFPA | LABORATÓRIO</span><span class="pill" id="st">PROCURANDO MARCADOR</span></div>
<div id="hud"></div>
<div id="hint">Aponte a câmera para o banner</div>

<!-- ====== CONFIGURE AQUI (o caminho do marcador está na tag <a-scene>, em imageTargetSrc) ====== -->
<a-scene id="sc" loop
  mindar-image="imageTargetSrc:./targets.mind; filterMinCF:0.0005; filterBeta:200; missTolerance:12; warmupTolerance:6; maxTrack:1; uiLoading:no; uiScanning:no; uiError:no"
  color-space="sRGB" renderer="colorManagement:true; antialias:false; alpha:true; maxCanvasWidth:1280; maxCanvasHeight:1280; powerPreference:high-performance"
  vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  <a-entity light="type:ambient;intensity:1.1"></a-entity>
  <a-entity light="type:directional;intensity:1.4" position="0.5 1 1.5"></a-entity>
  <a-entity id="anchor" mindar-image-target="targetIndex:0">
    <a-entity id="root">
      <a-entity id="spin">
        <a-entity id="m-heart" fit-model visible="false" position="0 0 0.25"></a-entity>
        <a-entity id="m-lungs" fit-model visible="false" position="0 0 0.25"></a-entity>
        <a-entity id="m-brain" fit-model visible="false" position="0 0 0.25"></a-entity>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>
<div id="stage"></div>

<section id="sheet">
  <button id="grab" aria-label="Recolher ou expandir"></button>
  <div class="row" id="tabs"></div>
  <div class="row chips" id="chips"></div>
  <div id="body">
    <h2 id="ttl"></h2>
    <p id="intro"></p>
    <div id="bar"></div>
    <p id="txt"></p>
    <div class="nav">
      <button id="prev">← Voltar</button><button id="next">Próximo →</button>
      <button id="pin">📌 Fixar</button><button id="snd">🔊</button>
    </div>
    <small>Arraste para girar · pince com dois dedos para aproximar. Material educativo: a prática deve ser aprendida em treinamento presencial com profissionais capacitados. Emergência: SAMU 192.</small>
  </div>
</section>

<script>
/* ====== CONFIGURE AQUI: nomes dos seus arquivos 3D ====== */
const CONFIG = { models: { heart:'./heart.glb', lungs:'./lungs.glb', brain:'./brain.glb' } };

const THREE = AFRAME.THREE, $ = s => document.querySelector(s);
const mat=(c,o)=>new THREE.MeshStandardMaterial({color:c,roughness:.65,metalness:.05,transparent:o<1,opacity:o??1});
const mesh=(g,c,o,p=[0,0,0])=>{const m=new THREE.Mesh(g,mat(c,o));m.position.set(...p);return m};
const box=(w,h,d,c,p,o)=>mesh(new THREE.BoxGeometry(w,h,d),c,o,p);
const ball=(r,c,p,o)=>mesh(new THREE.SphereGeometry(r,20,14),c,o,p);
const limb=(r,l,c)=>{const g=new THREE.CylinderGeometry(r,r,l,14);g.rotateX(Math.PI/2);g.translate(0,0,l/2);return mesh(g,c)};
const grp=(...k)=>{const g=new THREE.Group();k.forEach(x=>g.add(x));return g};
const SKIN='#f0b98d', SKIN2='#e3a579';
function lab(txt,col){const c=document.createElement('canvas');c.width=512;c.height=160;const x=c.getContext('2d');x.fillStyle=col;x.beginPath();(x.roundRect||x.rect).call(x,8,8,496,144,40);x.fill();x.fillStyle='#fff';x.font='bold 54px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,256,82);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));s.scale.set(.5,.156,1);s.renderOrder=9;s.visible=false;return s}

/* Ajusta qualquer modelo para caber no marcador, não importa o tamanho original */
AFRAME.registerComponent('fit-model',{init(){this.el.addEventListener('model-loaded',()=>{
  const o=this.el.getObject3D('mesh'); if(!o) return;
  const b=new THREE.Box3().setFromObject(o), s=b.getSize(new THREE.Vector3()), c=b.getCenter(new THREE.Vector3());
  const k=.7/Math.max(s.x,s.y,s.z); o.position.sub(c).multiplyScalar(k); o.scale.multiplyScalar(k);
})}});

/* ---------- Demonstração 1: RCP (mãos comprimem o peito no ritmo de 110/min) ---------- */
function buildRcp(){
  const tilt=new THREE.Group(); tilt.rotation.x=.96; tilt.position.set(0,-.03,.05);
  const turn=new THREE.Group(); tilt.add(turn);
  turn.add(mesh(new THREE.CylinderGeometry(.5,.5,.012,48),'#17463f'));
  const cg=new THREE.BoxGeometry(.44,.14,.34); cg.translate(0,.07,0);
  const chest=mesh(cg,'#3b82c4',1,[0,.006,-.04]); turn.add(chest);
  const ring=mesh(new THREE.RingGeometry(.035,.055,24).rotateX(-Math.PI/2),'#e5484d',1,[0,.142,0]); chest.add(ring);
  turn.add(ball(.075,SKIN,[0,.08,-.3]), box(.28,.09,.22,'#2b4a7a',[0,.051,.24]));
  const arms=mesh(new THREE.CylinderGeometry(.03,.03,.5,12),SKIN,1,[0,.3,0]);
  const hands=grp(box(.15,.04,.09,SKIN),box(.12,.035,.08,SKIN2,[0,.036,0]),arms); hands.position.set(0,.2,-.04); turn.add(hands);
  const tapL=ball(.03,SKIN,[-.24,.16,-.12]), tapR=ball(.03,SKIN,[.24,.16,-.12]); turn.add(tapL,tapR);
  const dea=grp(box(.14,.1,.1,'#22c55e'),box(.06,.012,.06,'#fff',[0,.056,0])); dea.position.set(.36,.056,.14); turn.add(dea);
  const rip=mesh(new THREE.RingGeometry(.06,.075,40).rotateX(-Math.PI/2),'#34d399',0,[0,.02,-.04]); turn.add(rip);
  const L=[lab('Você está bem?','#1f7a68'),lab('Ligue 192','#d64545'),null,null,lab('Traga o DEA','#2563eb')];
  L.forEach(l=>{if(l){l.position.set(0,.6,-.04);turn.add(l)}});
  return {root:tilt,turn,chest,ring,hands,tapL,tapR,dea,rip,L,b:-1,n:0,t:-9};
}
function animRcp(R,t,step){
  const per=60/110; let d=0;
  if(step>=3){
    d=.045*(.5-.5*Math.cos((t/per%1)*6.2832));
    const b=Math.floor(t/per+.5);
    if(b!==R.b){R.b=b;R.n++;R.t=t;beep();navigator.vibrate&&navigator.vibrate(20);hud(`Compressões: ${R.n}  ·  110/min`)}
  }
  R.hands.visible=step>=2; R.hands.position.y=step===2?.25+.03*Math.sin(t*3):.178-d;
  R.chest.scale.y=1-d/.14;
  R.ring.visible=step<=2; R.ring.scale.setScalar(step===2?1+.25*Math.abs(Math.sin(t*4)):1);
  R.tapL.visible=R.tapR.visible=step===0;
  R.tapL.position.y=R.tapR.position.y=.16+.04*Math.abs(Math.sin(t*6));
  R.dea.visible=step===1||step===4; R.dea.scale.setScalar(1+.08*Math.sin(t*5));
  R.L.forEach((l,i)=>l&&(l.visible=i===step));
  const k=(t-R.t)/.45; R.rip.material.opacity=k<1?.8*(1-k):0; R.rip.scale.setScalar(1+Math.min(k,1)*2.4);
}

/* ---------- Demonstração 2: Engasgo (vista em corte das vias aéreas) ---------- */
function buildCk(){
  const g=new THREE.Group(); g.position.set(0,.02,.15); g.scale.setScalar(.8);
  const turn=new THREE.Group(); g.add(turn);
  const tm=mat('#e57f8f',.4); tm.side=THREE.DoubleSide; tm.depthWrite=false;
  turn.add(new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.7,32,1,true),tm));
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(.21,.12,.14,32,1,true),tm); cap.position.y=.42; turn.add(cap);
  const lungs=[-1,1].map(s=>{const l=ball(.13,'#ff9aa8',[s*.17,-.45,0]);l.scale.set(1,1.3,.8);turn.add(l);return l});
  const food=ball(.09,'#f0a030',[.05,.05,0]); turn.add(food);
  const parts=Array.from({length:16},(_,i)=>{const p=new THREE.Mesh(new THREE.SphereGeometry(.014,8,6),new THREE.MeshBasicMaterial({color:'#7dd3fc'}));p.userData={o:i/16,x:(Math.random()-.5)*.13};turn.add(p);return p});
  const hand=grp(box(.14,.07,.06,SKIN),ball(.04,SKIN,[-.1,0,0])); hand.position.set(.4,.05,0); turn.add(hand);
  const fist=grp(ball(.06,SKIN),mesh(new THREE.ConeGeometry(.045,.12,12),'#34d399',1,[0,.12,0])); fist.position.set(0,-.72,0); turn.add(fist);
  const L=[lab('Passagem parcial','#1f7a68'),lab('Via bloqueada!','#d64545'),null,null,lab('Desmaiou? RCP + 192','#d64545')];
  L.forEach(l=>{if(l){l.position.set(0,.68,0);turn.add(l)}});
  return {root:g,turn,tm,food,lungs,parts,hand,fist,L};
}
function animCk(C,t,step,lt){
  let fx=0,fy=.05,block=step!==0,burst=false; C.food.visible=true;
  if(step===0)fx=.05;
  C.hand.visible=step===2; C.fist.visible=step===3; C.hand.position.x=.4; C.fist.position.y=-.72;
  if(step===2){const c=lt%2.4; if(c<1.5){const k=(c/.3)%1;C.hand.position.x=.4-.2*Math.sin(k*Math.PI);fy=.05+.012*Math.floor(c/.3)} else fy=.11}
  if(step===3){const c=lt%4;
    if(c<2){const k=(c/.4)%1;C.fist.position.y=-.72+.08*Math.sin(k*Math.PI);fy=.05+.03*Math.floor(c/.4)}
    else if(c<2.3)fy=.2;
    else{const u=(c-2.3)/.7;fy=.2+Math.min(u,1)*.85;burst=true;block=false;C.food.visible=c<3.1}}
  C.food.position.set(fx,fy,0);
  C.tm.color.set(block?'#ff4d5a':'#e57f8f'); C.tm.opacity=block?.4+.15*Math.sin(t*6):.4;
  C.lungs.forEach(l=>l.scale.set(1+.03*Math.sin(t*1.6)*(block?0:1),1.3,.8));
  C.parts.forEach((p,i)=>{
    const sp=burst?.9:.35, u=((t*sp+p.userData.o)%1);
    let y=.5-u*.85, x=p.userData.x;
    if(block){y=Math.max(y,fy+.11+(i%4)*.03)} else if(Math.abs(y-fy)<.13&&C.food.visible&&step===0){x=-.08}
    p.position.set(x,y,0); p.visible=step!==4||i<4;
  });
  C.L.forEach((l,i)=>l&&(l.visible=i===step));
}

/* ---------- Demonstração 3: Posição lateral de segurança ---------- */
function buildLat(){
  const tilt=new THREE.Group(); tilt.rotation.x=.96; tilt.position.set(0,-.03,.05);
  const turn=new THREE.Group(); tilt.add(turn);
  turn.add(mesh(new THREE.CylinderGeometry(.5,.5,.012,48),'#17463f'));
  const fig=new THREE.Group(); fig.scale.setScalar(.68); fig.position.z=-.04; turn.add(fig);
  const person=new THREE.Group(); fig.add(person);
  const tg=new THREE.BoxGeometry(.24,.12,.32); tg.translate(0,.06,0);
  person.add(mesh(tg,'#3b82c4',1,[0,0,-.1]), ball(.075,SKIN,[0,.08,-.36]), ball(.014,SKIN2,[0,.16,-.36]), box(.22,.1,.14,'#2b4a7a',[0,.05,.13]));
  const leg=x=>{const hip=new THREE.Group();hip.position.set(x,.05,.18);hip.add(limb(.035,.2,'#2b4a7a'));const knee=new THREE.Group();knee.position.z=.2;knee.add(limb(.032,.2,'#2b4a7a'));hip.add(knee);person.add(hip);return {hip,knee}};
  const legL=leg(-.06), legR=leg(.06);
  const armLg=new THREE.Group(); armLg.position.set(-.15,.09,-.2); armLg.add(limb(.028,.26,'#3b82c4'),ball(.03,SKIN,[0,0,.27])); person.add(armLg);
  const armR=new THREE.Group(); armR.position.set(.15,.09,-.2); armR.add(limb(.028,.26,'#3b82c4'),ball(.03,SKIN,[0,0,.27])); fig.add(armR);
  const L=[lab('Responde?','#1f7a68'),lab('Respira normalmente?','#d64545'),null,null,lab('Posição lateral ✔','#1f7a68')];
  L.forEach(l=>{if(l){l.position.set(0,.55,-.1);turn.add(l)}});
  return {root:tilt,turn,person,legL,armLg,armR,L,s:{arm:0,knee:0,roll:0}};
}
function animLat(A,step,dt){
  const T={arm:step>=2?1:0,knee:step>=3?1:0,roll:step>=4?1:0}, k=Math.min(1,dt*3.5), s=A.s;
  for(const n in s) s[n]+=(T[n]-s[n])*k;
  A.armR.rotation.y=s.arm*1.5708;
  A.armR.position.set(.15-.06*s.roll,.09-.06*s.roll,-.2);
  A.armLg.rotation.y=Math.PI*s.knee;
  A.legL.hip.rotation.x=-.96*s.knee; A.legL.knee.rotation.x=1.9*s.knee;
  A.person.rotation.z=-1.5708*s.roll; A.person.position.y=.12*s.roll;
  A.L.forEach((l,i)=>l&&(l.visible=i===step));
}

/* ---------- Conteúdo ---------- */
const TOP={anat:{label:'ANATOMIA 3D',subs:['heart','lungs','brain']},fa:{label:'PRIMEIROS SOCORROS',subs:['rcp','choke','lat']}};
const TP={
 heart:{chip:'♥ Coração',title:'O coração humano',intro:'O coração funciona como uma bomba muscular, impulsionando o sangue por todo o organismo.',steps:['Do tamanho aproximado de um punho fechado, o coração bate cerca de 100 mil vezes por dia.','Tem quatro câmaras: dois átrios recebem o sangue e dois ventrículos o bombeiam.','Na RCP, as compressões substituem temporariamente o bombeamento do coração, levando sangue ao cérebro.']},
 lungs:{chip:'Pulmões',title:'Os pulmões',intro:'É nos pulmões que o oxigênio entra no sangue e o gás carbônico sai.',steps:['As trocas gasosas acontecem nos alvéolos, pequenos sacos de ar que ficam no fim das vias aéreas.','O ar percorre nariz ou boca, traqueia e brônquios até chegar aos alvéolos.','Quando algo bloqueia as vias aéreas (engasgo), o ar não chega aos pulmões. Por isso reconhecer rápido é essencial.']},
 brain:{chip:'Cérebro',title:'O cérebro',intro:'O cérebro comanda movimentos, sentidos, memória e a respiração.',steps:['Mesmo pesando pouco, ele consome cerca de 20% do oxigênio do corpo.','Sem oxigênio, as células cerebrais começam a sofrer lesões em poucos minutos. Por isso agir rápido faz diferença.','Pessoa inconsciente que respira normalmente precisa de vias aéreas livres: veja a posição lateral de segurança.']},
 rcp:{chip:'RCP',title:'Reanimação cardiopulmonar',intro:'Para pessoa sem resposta e que não respira ou respira de forma anormal.',steps:['Verifique se o local é seguro. Toque nos ombros da pessoa e chame em voz alta.','Sem resposta e sem respirar normalmente? Ligue 192 (ou peça a alguém) e peça um DEA. Siga as instruções do atendente.','Apoie as mãos sobrepostas no centro do peito, com os braços esticados e os ombros sobre as mãos.','Comprima forte e rápido, de 100 a 120 vezes por minuto (cerca de 5 cm em adultos). Siga o bipe e deixe o peito voltar a cada compressão.','Não pare até a equipe chegar ou a pessoa reagir. Se houver DEA, ligue-o e siga a voz do aparelho.']},
 choke:{chip:'Engasgo',title:'Como reconhecer e agir no engasgo',intro:'A obstrução das vias aéreas pode ser leve ou grave. Reconhecer a diferença é essencial.',steps:['Observe a pessoa. Se ela consegue falar, tossir e respirar, incentive a tosse e acompanhe a situação.','Se não consegue falar, tossir ou respirar, leva as mãos à garganta ou fica arroxeada: é grave. Ligue 192 ou peça a alguém.','Incline a pessoa para frente e dê até 5 golpes firmes nas costas, entre as escápulas, com a base da mão.','Se não resolver, posicione-se atrás, com o punho acima do umbigo, e faça até 5 compressões rápidas para dentro e para cima. Alterne golpes e compressões.','Se a pessoa desmaiar, apoie-a no chão com cuidado, mantenha contato com o 192 e inicie a RCP conforme orientado. Bebês e gestantes exigem técnica específica: procure treinamento.']},
 lat:{chip:'Posição lateral',title:'Posição lateral de segurança',intro:'Pode ajudar a manter as vias aéreas desobstruídas em uma pessoa inconsciente que respira normalmente.',steps:['Verifique se o ambiente está seguro e avalie a resposta da pessoa.','Confirme se ela respira normalmente. Se não, ligue 192 e siga para a RCP.','Posicione o braço mais próximo de você em ângulo reto com o corpo.','Dobre o joelho do lado oposto e apoie a mão oposta junto ao rosto.','Role a pessoa em sua direção, mantendo a cabeça levemente inclinada para trás. Chame o 192 e monitore a respiração. Se houver suspeita de lesão na coluna, evite mover sem orientação.']}
};

/* ---------- Estado e interface ---------- */
const S={tab:'anat',sub:'heart',i:0,t0:0}, U={ry:0,s:1}, loaded={};
let RC,CK,LT,ac,sound=true,found=false,pinned=false;
const sc=$('#sc'), spin=$('#spin');
const MODEL={heart:$('#m-heart'),lungs:$('#m-lungs'),brain:$('#m-brain')};

function hud(t){const h=$('#hud');h.textContent=t;h.style.display=t?'block':'none'}
function beep(){if(!sound||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.08);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.09)}

function render(){
  $('#tabs').innerHTML=Object.entries(TOP).map(([k,v])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${v.label}</button>`).join('');
  $('#chips').innerHTML=TOP[S.tab].subs.map(k=>`<button data-sub="${k}" class="${S.sub===k?'on':''}">${TP[k].chip}</button>`).join('');
  const T=TP[S.sub];
  $('#ttl').textContent=T.title; $('#intro').textContent=T.intro;
  $('#bar').innerHTML=T.steps.map((_,i)=>`<i class="${i<=S.i?'on':''}"></i>`).join('');
  $('#txt').textContent=`${S.i+1}. ${T.steps[S.i]}`;
  $('#prev').disabled=S.i===0;
  $('#next').textContent=S.i===T.steps.length-1?'Reiniciar ↺':'Próximo →';
  $('#pin').classList.toggle('on',pinned); $('#pin').textContent=pinned?'📍 Soltar':'📌 Fixar';
  $('#snd').textContent=sound?'🔊':'🔇';
  const anat=S.tab==='anat';
  for(const k in MODEL) MODEL[k].object3D.visible=anat&&S.sub===k;
  RC.root.visible=S.sub==='rcp'; CK.root.visible=S.sub==='choke'; LT.root.visible=S.sub==='lat';
  if(!(S.sub==='rcp'&&S.i>=3)) hud('');
}
function go(sub,i=0){
  S.sub=sub;S.i=i;S.t0=sc.time/1000;U.ry=0;U.s=1;
  if(MODEL[sub]&&!loaded[sub]){loaded[sub]=1;MODEL[sub].setAttribute('gltf-model',CONFIG.models[sub])}
  if(sub==='rcp'&&i>=3)RC.n=0;
  render();
}
function step(d){const n=TP[S.sub].steps.length;let i=S.i+d;if(i>=n)i=0;S.i=Math.max(0,i);S.t0=sc.time/1000;if(S.sub==='rcp'&&S.i===3)RC.n=0;render()}

document.addEventListener('pointerdown',()=>{if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}},{once:true});
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){S.tab=b.dataset.tab;go(TOP[S.tab].subs[0])}};
$('#chips').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.sub)};
$('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
$('#snd').onclick=()=>{sound=!sound;render()};
$('#grab').onclick=()=>$('#sheet').classList.toggle('min');
$('#pin').onclick=()=>{
  if(!found&&!pinned){$('#hint').textContent='Reconheça o banner antes de fixar';$('#hint').style.display='block';return}
  const r=$('#root').object3D;
  if(!pinned){const cam=sc.camera;sc.object3D.updateMatrixWorld(true);cam.attach(r);pinned=true;st('MODO FIXO',1)}
  else{$('#anchor').object3D.add(r);r.position.set(0,0,0);r.quaternion.identity();r.scale.set(1,1,1);pinned=false;found=false;st('PROCURANDO MARCADOR',0)}
  render();
};

/* Gestos: arrastar gira, pinça aproxima */
const P=new Map(), stage=$('#stage');
stage.onpointerdown=e=>{stage.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY})};
stage.onpointermove=e=>{
  const p=P.get(e.pointerId); if(!p)return;
  if(P.size===1){U.ry+=(e.clientX-p.x)*.012}
  else if(P.size===2){const o=[...P.entries()].find(([id])=>id!==e.pointerId)[1];const d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);U.s=Math.min(2.2,Math.max(.5,U.s*d1/d0))}
  p.x=e.clientX;p.y=e.clientY;
};
stage.onpointerup=stage.onpointercancel=e=>P.delete(e.pointerId);

function st(t,ok){const e=$('#st');e.textContent=t;e.classList.toggle('ok',!!ok);$('#hint').style.display=ok?'none':'block';$('#hint').textContent='Aponte a câmera para o banner'}

/* Loop principal */
AFRAME.registerComponent('loop',{
  init(){
    RC=buildRcp();CK=buildCk();LT=buildLat();
    [RC,CK,LT].forEach(o=>{o.root.visible=false;spin.object3D.add(o.root)});
    $('#anchor').addEventListener('targetFound',()=>{found=true;if(!pinned)st('MARCADOR RECONHECIDO',1)});
    $('#anchor').addEventListener('targetLost',()=>{if(!pinned){found=false;st('PROCURANDO MARCADOR',0)}});
    this.el.addEventListener('loaded',()=>{render()});
    render();
  },
  tick(ms,dtms){
    const t=ms/1000,dt=Math.min(dtms/1000,.1),lt=t-S.t0;
    spin.object3D.scale.setScalar(U.s);
    if(S.tab==='anat'){
      const m=MODEL[S.sub].object3D; m.rotation.y=U.ry;
      const s=S.sub==='heart'?1+Math.pow(Math.abs(Math.sin(t*3.8)),8)*.07:S.sub==='lungs'?1+.035*Math.sin(t*1.6):1;
      m.scale.setScalar(s); m.position.y=S.sub==='brain'?.02*Math.sin(t*1.5):0;
    } else if(S.sub==='rcp'){RC.turn.rotation.y=U.ry;animRcp(RC,t,S.i)}
    else if(S.sub==='choke'){CK.turn.rotation.y=U.ry;animCk(CK,t,S.i,lt)}
    else if(S.sub==='lat'){LT.turn.rotation.y=U.ry;animLat(LT,S.i,dt)}
  }
});
</script>
</body>
</html>
